<svg viewBox="0 0 1000 960" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pipeline de l'agent NetScope</title>
<desc>Schéma du pipeline NetScope : un événement DNS (domaine brut ou features déjà calculées) est transformé en 16 features numériques, scoré par un modèle LightGBM, puis à la fois expliqué par SHAP et évalué par un moteur de décision à seuil fixe (80/100). Un trafic normal ne déclenche rien ; un trafic suspect isole automatiquement l'hôte et notifie CrisisBot. Le tout est affiché sur le tableau de bord NetScope.</desc>

<style>
  .box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; }
  .box-accent { fill: #ffffff; stroke: #14285a; stroke-width: 2; }
  .title { font-family: sans-serif; font-size: 15.5px; font-weight: 600; fill: #111111; }
  .subtitle { font-family: sans-serif; font-size: 12px; fill: #555555; }
  .step-label { font-family: sans-serif; font-size: 11px; fill: #555555; letter-spacing: 0.04em; }
  .arrow { stroke: #444444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .arrow-accent { stroke: #14285a; stroke-width: 1.5; fill: none; marker-end: url(#arrow-accent); }
  .connector { stroke: #444444; stroke-width: 1.5; fill: none; }
  .connector-accent { stroke: #14285a; stroke-width: 1.5; fill: none; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
  </marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#14285a"/>
  </marker>
</defs>

<!-- Step 1: incoming DNS event -->
<rect x="350" y="20" width="300" height="62" rx="10" class="box"/>
<text x="500" y="46" text-anchor="middle" class="title">Événement DNS entrant</text>
<text x="500" y="66" text-anchor="middle" class="subtitle">domaine brut ou features calculées</text>

<line x1="500" y1="82" x2="500" y2="112" class="arrow"/>

<!-- Step 2: live feature extraction -->
<rect x="310" y="112" width="380" height="80" rx="10" class="box"/>
<text x="500" y="138" text-anchor="middle" class="title">Extraction de features</text>
<text x="500" y="158" text-anchor="middle" class="subtitle">16 features numériques</text>
<text x="500" y="176" text-anchor="middle" class="step-label">10 nom + 6 réponse DNS (résolution réelle)</text>

<line x1="500" y1="192" x2="500" y2="222" class="arrow"/>

<!-- Step 3: LightGBM -->
<rect x="350" y="222" width="300" height="80" rx="10" class="box"/>
<text x="500" y="248" text-anchor="middle" class="title">LightGBM</text>
<text x="500" y="268" text-anchor="middle" class="subtitle">score de risque 0–100</text>
<text x="500" y="286" text-anchor="middle" class="step-label">retenu parmi 5 modèles (F1 ≈ 0,831)</text>

<line x1="500" y1="302" x2="500" y2="332" class="arrow"/>

<!-- fan out to 2: SHAP + threshold decision -->
<line x1="300" y1="332" x2="700" y2="332" class="connector"/>
<line x1="300" y1="332" x2="300" y2="362" class="arrow"/>
<line x1="700" y1="332" x2="700" y2="362" class="arrow"/>

<rect x="170" y="362" width="260" height="66" rx="10" class="box"/>
<text x="300" y="388" text-anchor="middle" class="title" style="font-size:14px">Explication SHAP</text>
<text x="300" y="408" text-anchor="middle" class="subtitle">facteurs + / − contributifs</text>

<rect x="570" y="362" width="260" height="66" rx="10" class="box"/>
<text x="700" y="388" text-anchor="middle" class="title" style="font-size:14px">Décision par seuil</text>
<text x="700" y="408" text-anchor="middle" class="subtitle">seuil fixe : 80 / 100</text>

<!-- SHAP goes straight down to merge -->
<line x1="300" y1="428" x2="300" y2="800" class="connector"/>

<!-- threshold decision fans to 2 outcomes -->
<line x1="700" y1="428" x2="700" y2="458" class="arrow"/>
<line x1="560" y1="458" x2="840" y2="458" class="connector"/>
<line x1="560" y1="458" x2="560" y2="488" class="arrow"/>
<line x1="840" y1="458" x2="840" y2="488" class="arrow-accent"/>

<rect x="430" y="488" width="260" height="66" rx="10" class="box"/>
<text x="560" y="514" text-anchor="middle" class="title" style="font-size:14px">Trafic normal</text>
<text x="560" y="534" text-anchor="middle" class="subtitle">score ≤ 80</text>

<rect x="710" y="488" width="260" height="66" rx="10" class="box-accent"/>
<text x="840" y="514" text-anchor="middle" class="title" style="font-size:14px">Trafic suspect</text>
<text x="840" y="534" text-anchor="middle" class="subtitle">score &gt; 80</text>

<!-- normal traffic straight to merge -->
<line x1="560" y1="554" x2="560" y2="800" class="connector"/>

<!-- suspicious traffic fans to isolate + notify -->
<line x1="840" y1="554" x2="840" y2="584" class="arrow-accent"/>
<line x1="730" y1="584" x2="950" y2="584" class="connector-accent"/>
<line x1="730" y1="584" x2="730" y2="614" class="arrow-accent"/>
<line x1="950" y1="584" x2="950" y2="614" class="arrow-accent"/>

<rect x="600" y="614" width="260" height="66" rx="10" class="box-accent"/>
<text x="730" y="640" text-anchor="middle" class="title" style="font-size:14px">Isoler l'hôte</text>
<text x="730" y="660" text-anchor="middle" class="subtitle">action automatique immédiate</text>

<rect x="820" y="614" width="260" height="80" rx="10" class="box-accent"/>
<text x="950" y="640" text-anchor="middle" class="title" style="font-size:14px">Webhook CrisisBot</text>
<text x="950" y="660" text-anchor="middle" class="subtitle">notification automatique</text>
<text x="950" y="678" text-anchor="middle" class="step-label">/api/webhook/incident</text>

<line x1="730" y1="680" x2="730" y2="800" class="connector"/>
<line x1="950" y1="694" x2="950" y2="800" class="connector"/>

<!-- merge into dashboard -->
<line x1="300" y1="800" x2="950" y2="800" class="connector"/>
<line x1="625" y1="800" x2="625" y2="830" class="arrow"/>

<rect x="485" y="830" width="280" height="70" rx="10" class="box"/>
<text x="625" y="856" text-anchor="middle" class="title">Tableau de bord NetScope</text>
<text x="625" y="876" text-anchor="middle" class="subtitle">score, facteurs SHAP, action</text>

<text x="500" y="935" text-anchor="middle" class="step-label">Si le pare-feu n'envoie qu'un nom de domaine, les 16 features sont calculées en direct (dnspython)</text>
</svg>
