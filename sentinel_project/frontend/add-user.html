<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Ajouter un utilisateur</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563EB'/><text x='50' y='68' font-size='56' text-anchor='middle'>🛡️</text></svg>">
<style>
  :root {
    /* Palette commune aux 4 dashboards (page claire, cartes blanches) */
    --bg: #F1F2F6; --card: #FFFFFF;
    --border: #E5E7EB; --border-strong: #D1D5DB;
    --text: #14181F; --text-dim: #5B6472; --text-faint: #9AA2AD;
    --accent: #2563EB; --accent-soft: #EFF6FF;
    --danger: #DC2626; --radius: 10px;
    /* Panneau "console" sombre — motif repris des autres agents (DarkWatch/NetScope) */
    --panel: #10162A; --panel-2: #171F36;
    --panel-border: rgba(255,255,255,0.08);
    --panel-text: #E6EDF3; --panel-text-dim: #8B96A5; --panel-text-faint: #64748B;
    --accent-on-dark: #60A5FA;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; }
  .shell { max-width: 640px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
  .masthead { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .masthead .mark { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--mono); font-weight: 500; font-size: 15px; }
  .masthead h1 { font-size: 18px; font-weight: 600; margin: 0; color: var(--text); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); text-decoration: none; margin-bottom: 1.5rem; }
  .back-link:hover { color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 1.25rem; }
  .panel-label { font-family: var(--mono); font-size: 11px; color: var(--panel-text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 14px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-full { grid-column: 1 / -1; }
  label { display: block; font-family: var(--mono); font-size: 11px; color: var(--panel-text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"] { width: 100%; background: var(--panel-2); border: 1px solid var(--panel-border); border-radius: 6px; color: var(--panel-text); padding: 8px 10px; font-family: inherit; font-size: 13.5px; }
  input:focus { outline: none; border-color: var(--accent-on-dark); }
  .checks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px; padding: 6px 0; }
  .checks label { display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; color: var(--panel-text-dim); text-transform: none; letter-spacing: 0; margin: 0; cursor: pointer; }
  .checks input[type="checkbox"] { accent-color: var(--accent-on-dark); width: 15px; height: 15px; }
  button.submit { grid-column: 1 / -1; padding: 13px; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 6px; }
  button.submit:hover { opacity: 0.9; }
  button.submit:disabled { opacity: 0.5; cursor: default; }
  .feedback { display: none; margin-top: 1rem; padding: 12px 14px; border-radius: 8px; font-size: 13.5px; font-family: var(--mono); }
  .feedback.ok { background: rgba(96,165,250,0.12); border: 1px solid var(--accent-on-dark); color: var(--accent-on-dark); }
  .feedback.error { background: rgba(220,38,38,0.15); border: 1px solid var(--danger); color: #FCA5A5; }
</style>
</head>
<body>
<div class="shell">
  <a href="index.html" class="back-link">← retour à la console</a>
  <div class="masthead"><div class="mark">S</div><h1>Ajouter un utilisateur / log</h1></div>

  <div class="panel">
    <p class="panel-label">Nouvel événement de connexion</p>
    <form id="new-case-form">
      <div><label>Utilisateur</label><input type="text" id="f-user" required placeholder="Ahmed Trabelsi"></div>
      <div><label>Poste</label><input type="text" id="f-pc" required placeholder="PC-04"></div>
      <div class="field-full"><label>Département</label><input type="text" id="f-dept" required placeholder="Direction Financiere"></div>
      <div><label>Date</label><input type="date" id="f-date" required></div>
      <div><label>Heure</label><input type="time" id="f-heure" required></div>
      <div class="field-full"><label>Scénario (optionnel, pour toi-même)</label><input type="text" id="f-scenario" placeholder="ex: test connexion nocturne"></div>
      <div class="checks">
        <label><input type="checkbox" id="f-offhours"> hors horaires</label>
        <label><input type="checkbox" id="f-newdevice"> nouveau poste/appareil</label>
        <label><input type="checkbox" id="f-weekend"> week-end</label>
        <label><input type="checkbox" id="f-holiday"> jour férié</label>
      </div>
      <button type="submit" class="submit" id="submit-btn">ajouter et analyser →</button>
    </form>
    <div id="feedback" class="feedback"></div>
  </div>
</div>

<script>
// Page servie par le même backend FastAPI (même port) — chaîne vide = "même origine".
const API_BASE = "";

const form = document.getElementById("new-case-form");
const submitBtn = document.getElementById("submit-btn");
const feedback = document.getElementById("feedback");

const today = new Date();
document.getElementById("f-date").value = today.toISOString().split("T")[0];
document.getElementById("f-heure").value = today.toTimeString().slice(0,5);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "ajout en cours…";
  feedback.style.display = "none";

  const heure = document.getElementById("f-heure").value;
  const hour = parseInt(heure.split(":")[0], 10);

  const payload = {
    user: document.getElementById("f-user").value,
    pc: document.getElementById("f-pc").value,
    department: document.getElementById("f-dept").value,
    date: document.getElementById("f-date").value,
    heure: heure,
    hour: hour,
    scenario: document.getElementById("f-scenario").value,
    is_off_hours: document.getElementById("f-offhours").checked,
    is_new_device: document.getElementById("f-newdevice").checked,
    is_weekend: document.getElementById("f-weekend").checked,
    is_holiday: document.getElementById("f-holiday").checked,
  };

  try {
    const res = await fetch(`${API_BASE}/api/cases`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("échec");
    const data = await res.json();

    feedback.className = "feedback ok";
    feedback.style.display = "block";
    feedback.innerHTML = `Ajouté (id: ${data.id}) — score ${data.conclusion.risk_score}/100, ${data.conclusion.action_label}.
      <br><a href="index.html" style="color: var(--accent-on-dark);">Voir dans la console →</a>`;
    form.reset();
    document.getElementById("f-date").value = today.toISOString().split("T")[0];
  } catch (err) {
    feedback.className = "feedback error";
    feedback.style.display = "block";
    feedback.textContent = "Erreur : backend injoignable ou requête invalide.";
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "ajouter et analyser →";
});
</script>
</body>
</html>
