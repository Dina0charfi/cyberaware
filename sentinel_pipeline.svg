<svg viewBox="0 0 820 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pipeline de l'agent Sentinel</title>
<desc>Schéma du pipeline Sentinel : un événement de connexion brut est transformé en 7 features universelles, scoré par un modèle Isolation Forest, puis évalué par un moteur de décision à seuils différenciés qui aboutit à l'une de quatre actions (aucune action, surveillance, formation ciblée, ou escalade humaine), cette dernière notifiant automatiquement CrisisBot.</desc>

<style>
  .box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; }
  .box-accent { fill: #ffffff; stroke: #14285a; stroke-width: 2; }
  .title { font-family: sans-serif; font-size: 16px; font-weight: 600; fill: #111111; }
  .subtitle { font-family: sans-serif; font-size: 12.5px; fill: #555555; }
  .step-label { font-family: sans-serif; font-size: 11px; fill: #555555; letter-spacing: 0.06em; }
  .arrow { stroke: #444444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .arrow-accent { stroke: #14285a; stroke-width: 1.5; fill: none; marker-end: url(#arrow-accent); }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
  </marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#14285a"/>
  </marker>
</defs>

<!-- Step 1: raw login event -->
<rect x="260" y="20" width="300" height="62" rx="10" class="box"/>
<text x="410" y="46" text-anchor="middle" class="title">Connexion brute</text>
<text x="410" y="66" text-anchor="middle" class="subtitle">utilisateur, poste, service, horodatage</text>

<line x1="410" y1="82" x2="410" y2="112" class="arrow"/>

<!-- Step 2: feature extraction -->
<rect x="230" y="112" width="360" height="62" rx="10" class="box"/>
<text x="410" y="138" text-anchor="middle" class="title">Extraction de features</text>
<text x="410" y="158" text-anchor="middle" class="subtitle">7 signaux universels (heure, week-end, appareil...)</text>

<line x1="410" y1="174" x2="410" y2="204" class="arrow"/>

<!-- Step 3: Isolation Forest -->
<rect x="230" y="204" width="360" height="62" rx="10" class="box"/>
<text x="410" y="230" text-anchor="middle" class="title">Isolation Forest</text>
<text x="410" y="250" text-anchor="middle" class="subtitle">modèle non supervisé — score d'anomalie</text>

<line x1="410" y1="266" x2="410" y2="296" class="arrow"/>

<!-- Step 4: decision engine -->
<rect x="230" y="296" width="360" height="62" rx="10" class="box"/>
<text x="410" y="322" text-anchor="middle" class="title">Moteur de décision</text>
<text x="410" y="342" text-anchor="middle" class="subtitle">seuils différenciés selon le service</text>

<!-- fan out to 4 -->
<line x1="410" y1="358" x2="410" y2="378" class="arrow"/>
<line x1="90" y1="378" x2="730" y2="378" class="arrow" marker-end="none"/>
<line x1="90" y1="378" x2="90" y2="404" class="arrow"/>
<line x1="303" y1="378" x2="303" y2="404" class="arrow"/>
<line x1="517" y1="378" x2="517" y2="404" class="arrow"/>
<line x1="730" y1="378" x2="730" y2="404" class="arrow"/>

<!-- 4 outcome boxes -->
<rect x="20" y="404" width="140" height="72" rx="10" class="box"/>
<text x="90" y="430" text-anchor="middle" class="title" style="font-size:14px">Aucune action</text>
<text x="90" y="450" text-anchor="middle" class="subtitle">score bas</text>
<text x="90" y="466" text-anchor="middle" class="step-label">&lt; 25 (15 sensible)</text>

<rect x="233" y="404" width="140" height="72" rx="10" class="box"/>
<text x="303" y="430" text-anchor="middle" class="title" style="font-size:14px">Surveillance</text>
<text x="303" y="450" text-anchor="middle" class="subtitle">score modéré</text>
<text x="303" y="466" text-anchor="middle" class="step-label">25–55 (15–40)</text>

<rect x="447" y="404" width="140" height="72" rx="10" class="box"/>
<text x="517" y="430" text-anchor="middle" class="title" style="font-size:14px">Formation ciblée</text>
<text x="517" y="450" text-anchor="middle" class="subtitle">score élevé</text>
<text x="517" y="466" text-anchor="middle" class="step-label">55–85 (40–65)</text>

<rect x="660" y="404" width="140" height="72" rx="10" class="box-accent"/>
<text x="730" y="430" text-anchor="middle" class="title" style="font-size:14px">Escalade humaine</text>
<text x="730" y="450" text-anchor="middle" class="subtitle">score critique</text>
<text x="730" y="466" text-anchor="middle" class="step-label">&gt; 85 (65)</text>

<!-- escalation -> CrisisBot -->
<line x1="730" y1="476" x2="730" y2="520" class="arrow-accent"/>
<line x1="730" y1="520" x2="730" y2="560" class="arrow-accent"/>

<rect x="580" y="560" width="220" height="70" rx="10" class="box-accent"/>
<text x="690" y="588" text-anchor="middle" class="title">Webhook CrisisBot</text>
<text x="690" y="608" text-anchor="middle" class="subtitle">notification automatique</text>
<text x="690" y="622" text-anchor="middle" class="step-label">/api/webhook/incident</text>

<!-- side note: dashboard -->
<line x1="303" y1="476" x2="303" y2="700" class="arrow" marker-end="none"/>
<line x1="517" y1="476" x2="517" y2="700" class="arrow" marker-end="none"/>
<line x1="90" y1="476" x2="90" y2="700" class="arrow" marker-end="none"/>
<line x1="90" y1="700" x2="303" y2="700" class="arrow" marker-end="none"/>
<line x1="303" y1="700" x2="517" y2="700" class="arrow" marker-end="none"/>
<line x1="517" y1="700" x2="303" y2="700" class="arrow" marker-end="none"/>
<line x1="303" y1="700" x2="303" y2="720" class="arrow"/>

<rect x="163" y="720" width="280" height="66" rx="10" class="box"/>
<text x="303" y="746" text-anchor="middle" class="title" style="font-size:14px">Tableau de bord Sentinel</text>
<text x="303" y="766" text-anchor="middle" class="subtitle">carte de résultat colorée par issue</text>

<text x="410" y="860" text-anchor="middle" class="step-label">Les valeurs entre parenthèses sont les seuils appliqués aux comptes de services sensibles</text>
</svg>
